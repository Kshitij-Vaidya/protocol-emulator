project:
  title:        "Protocol Emulator"
  author:       "Kshitij Vaidya"
  discord:      ""
  description:  "Programmable I/O processor: a core with deterministic timing emulates protocols in firmware"
  language:     "Verilog"
  clock_hz:     50000000
  tiles: "4x2"
  top_module:  "tt_um_protocolEmulator"
  source_files:
    - "tt_um_protocolEmulator.v"
    - "hostSpi.v"
    - "core.v"
    - "fifo.v"
    - "pinSync.v"
    - "progMem.v"
    - "sram_bb.v"

pinout:
  ui[0]: "host SCK"
  ui[1]: "host CS (active low)"
  ui[2]: "host MOSI"
  ui[3]: "pin 15"
  ui[4]: "pin 16"
  ui[5]: "pin 17"
  ui[6]: "pin 18"
  ui[7]: "pin 19"
  uo[0]: "host MISO"
  uo[1]: "pin 8"
  uo[2]: "pin 9"
  uo[3]: "pin 10"
  uo[4]: "pin 11"
  uo[5]: "pin 12"
  uo[6]: "pin 13"
  uo[7]: "pin 14"
  uio[0]: "pin 0"
  uio[1]: "pin 1"
  uio[2]: "pin 2"
  uio[3]: "pin 3"
  uio[4]: "pin 4"
  uio[5]: "pin 5"
  uio[6]: "pin 6"
  uio[7]: "pin 7"

yaml_version: 6
